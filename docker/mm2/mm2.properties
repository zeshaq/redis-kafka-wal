# MirrorMaker 2 standalone — replicates origin-region topics between all
# three clusters. IdentityReplicationPolicy keeps topic names unchanged on
# the target so consumers see "us.events" everywhere regardless of which
# cluster produced it. Origin region is encoded in the topic name itself,
# so loops are impossible: us.events is only produced in cluster `us` and
# replicated outward to `eu` and `ap`; cluster `us` will not re-mirror it
# back to itself.

clusters = us, eu, ap

us.bootstrap.servers = kafka-us:29092
eu.bootstrap.servers = kafka-eu:29092
ap.bootstrap.servers = kafka-ap:29092

# Use IdentityReplicationPolicy so topic names are not prefixed with the
# source cluster alias on the target.
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# Internal MM2 topics need replication factor 1 in single-broker labs.
us.config.storage.replication.factor = 1
us.offset.storage.replication.factor = 1
us.status.storage.replication.factor = 1
eu.config.storage.replication.factor = 1
eu.offset.storage.replication.factor = 1
eu.status.storage.replication.factor = 1
ap.config.storage.replication.factor = 1
ap.offset.storage.replication.factor = 1
ap.status.storage.replication.factor = 1

# Replication-side topic factors (target side). Heartbeats + checkpoints +
# any auto-created mirrored topics use these.
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
replication.factor = 1

# Six directional flows. Each one replicates only the origin-region's events
# topic outward (e.g. us->eu only carries us.events), preventing loops.
us->eu.enabled = true
us->eu.topics = us\.events
us->ap.enabled = true
us->ap.topics = us\.events

eu->us.enabled = true
eu->us.topics = eu\.events
eu->ap.enabled = true
eu->ap.topics = eu\.events

ap->us.enabled = true
ap->us.topics = ap\.events
ap->eu.enabled = true
ap->eu.topics = ap\.events

# Group offset replication is unnecessary because each region runs its own
# consumer group on its own bootstrap.
emit.checkpoints.enabled = false
sync.group.offsets.enabled = false

# Refresh source topic configs/partitions reasonably quickly for the lab.
refresh.topics.interval.seconds = 10
refresh.groups.interval.seconds = 30
