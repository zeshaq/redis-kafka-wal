apiVersion: v1
kind: ConfigMap
metadata:
  name: mm2-config
data:
  mm2.properties: |
    clusters = us, eu, ap
    us.bootstrap.servers = kafka-0.kafka.us.svc.cluster.local:29092
    eu.bootstrap.servers = kafka-0.kafka.eu.svc.cluster.local:29092
    ap.bootstrap.servers = kafka-0.kafka.ap.svc.cluster.local:29092

    replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

    us.config.storage.replication.factor = 1
    us.offset.storage.replication.factor = 1
    us.status.storage.replication.factor = 1
    eu.config.storage.replication.factor = 1
    eu.offset.storage.replication.factor = 1
    eu.status.storage.replication.factor = 1
    ap.config.storage.replication.factor = 1
    ap.offset.storage.replication.factor = 1
    ap.status.storage.replication.factor = 1

    checkpoints.topic.replication.factor = 1
    heartbeats.topic.replication.factor = 1
    offset-syncs.topic.replication.factor = 1
    replication.factor = 1

    us->eu.enabled = true
    us->eu.topics = us\.events
    us->ap.enabled = true
    us->ap.topics = us\.events
    eu->us.enabled = true
    eu->us.topics = eu\.events
    eu->ap.enabled = true
    eu->ap.topics = eu\.events
    ap->us.enabled = true
    ap->us.topics = ap\.events
    ap->eu.enabled = true
    ap->eu.topics = ap\.events

    emit.checkpoints.enabled = false
    sync.group.offsets.enabled = false
    refresh.topics.interval.seconds = 10
    refresh.groups.interval.seconds = 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirrormaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mirrormaker
  template:
    metadata:
      labels:
        app: mirrormaker
    spec:
      containers:
        - name: mirrormaker
          image: confluentinc/cp-kafka:7.6.1
          command:
            - /bin/bash
            - -c
            - "/usr/bin/connect-mirror-maker /etc/mm2/mm2.properties"
          volumeMounts:
            - name: config
              mountPath: /etc/mm2
      volumes:
        - name: config
          configMap:
            name: mm2-config
